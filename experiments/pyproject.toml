[project]
name = "locus-experiments"
version = "0.1.0"
description = "Stage 2 benchmarks for Locus: router accuracy, STT, TTS and peak RAM"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "psutil>=5.9",
    "py-cpuinfo>=9.0",
]

[dependency-groups]
stt = [
    "faster-whisper>=1.1",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "numpy>=1.26",
]
tts = [
    "piper-tts>=1.2",
    "kokoro-onnx>=0.4",
    "pyttsx3>=2.90",
    "soundfile>=0.12",
    "numpy>=1.26",
]
download = [
    "huggingface-hub>=0.24",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["bench", "tests"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
