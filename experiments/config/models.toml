path = "models/microsoft_Phi-4-mini-instruct-Q4_K_M.gguf"  # 2.49 GB
repo = "bartowski/microsoft_Phi-4-mini-instruct-GGUF"
file = "microsoft_Phi-4-mini-instruct-Q4_K_M.gguf"

[[model]]
