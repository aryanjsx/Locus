# Candidate LLMs for Experiment 1. All GGUF, Q4_K_M quantisation, from bartowski's
# Hugging Face repos (one uploader, so the quantisation recipe is the same for all).
#
# `path` is where the file lives (relative to experiments/). `--download` fetches
# missing files from `repo`/`file`. Names and sizes verified on 2026-10-09.
#
# RAM budgets from the scope doc: Locus may use <= 3 GB on the 8 GB tier and
# <= 5 GB on the 16 GB tier, for the LLM + speech-to-text + TTS together.
# Models marked OVER BUDGET can't pass Experiment 4 at Q4_K_M; they're kept so we
# can see what the accuracy trade-off is.

# ---- 8 GB tier ----

[[model]]
id = "qwen3.5-2b"
tier = "8gb"
path = "models/Qwen_Qwen3.5-2B-Q4_K_M.gguf"  # 1.40 GB
repo = "bartowski/Qwen_Qwen3.5-2B-GGUF"
file = "Qwen_Qwen3.5-2B-Q4_K_M.gguf"

[[model]]
id = "llama3.2-3b"
tier = "8gb"
path = "models/Llama-3.2-3B-Instruct-Q4_K_M.gguf"  # 2.02 GB
repo = "bartowski/Llama-3.2-3B-Instruct-GGUF"
file = "Llama-3.2-3B-Instruct-Q4_K_M.gguf"

[[model]]
id = "gemma4-e2b"
tier = "8gb"
path = "models/google_gemma-4-E2B-it-Q4_K_M.gguf"  # 3.46 GB - OVER BUDGET for 8 GB tier
repo = "bartowski/google_gemma-4-E2B-it-GGUF"
file = "google_gemma-4-E2B-it-Q4_K_M.gguf"

# ---- 16 GB tier ----

[[model]]
